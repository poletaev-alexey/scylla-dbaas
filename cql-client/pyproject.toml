[project]
name = "cql-client"
version = "0.1.0"
description = "Small CQL client for Scylla DBaaS Clusters: write, read and verify demo data"
requires-python = ">=3.12"
dependencies = [
    "scylla-driver>=3.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cql-client = "cql_client.cli:main"
dbaas-e2e = "cql_client.e2e:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cql_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# scylla-driver ships no type information (imported as ``cassandra``).
module = ["cassandra", "cassandra.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
