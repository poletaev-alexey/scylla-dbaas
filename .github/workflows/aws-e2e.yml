# Manual end-to-end test on real AWS (eu-central-1). Costs money while it runs; it always
# deletes the Clusters it created, and a tag-based safety net terminates any leftover EC2
# instance even if the Control Plane died mid-run.
#
# Flow: start the Control Plane on the runner with the `aws` Provider driver (ADR-0001: the
# Control Plane runs outside AWS) -> `dbaas-e2e` creates a Cluster through the public API ->
# cql-client writes rows at QUORUM and verifies them -> optional Backup + Restore into a new
# Cluster + verify -> delete every Cluster -> safety net.
#
# ---------------------------------------------------------------------------------------
# One-time setup (an AWS admin does this once per account; no long-lived keys in GitHub):
#
# 1. Deploy the long-lived base stack once: `terraform -chdir=infra/base apply`.
#    Note its outputs: the Terraform state bucket and the Backup bucket.
#
# 2. Create the GitHub OIDC identity provider in IAM:
#      aws iam create-open-id-connect-provider \
#        --url https://token.actions.githubusercontent.com \
#        --client-id-list sts.amazonaws.com
#
# 3. Create an IAM role (e.g. `dbaas-github-e2e`) with this trust policy, scoped to the
#    `aws-e2e` GitHub environment of this repository only:
#      {
#        "Version": "2012-10-17",
#        "Statement": [{
#          "Effect": "Allow",
#          "Principal": {"Federated":
#            "arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com"},
#          "Action": "sts:AssumeRoleWithWebIdentity",
#          "Condition": {"StringEquals": {
#            "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
#            "token.actions.githubusercontent.com:sub":
#              "repo:<OWNER>/<REPO>:environment:aws-e2e"}}
#        }]
#      }
#    Permissions: what `infra/cluster` needs (EC2 instances/SGs/describe in eu-central-1,
#    iam:PassRole on the node instance profile from infra/base, Secrets Manager on
#    `dbaas/*`, S3 read/write on the state bucket and on the Backup bucket).
#
# 4. In GitHub: create the environment `aws-e2e` (add required reviewers to guard spend)
#    and set repository variables:
#      AWS_E2E_ROLE_ARN        arn:aws:iam::<ACCOUNT_ID>:role/dbaas-github-e2e
#      DBAAS_TF_STATE_BUCKET   Terraform state bucket (output of infra/base)
#      DBAAS_BACKUP_BUCKET     Backup bucket (output of infra/base)
#
# Docs: https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws
# ---------------------------------------------------------------------------------------
name: aws-e2e

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows to write with cql-client
        type: number
        default: 1000
      with_restore:
        description: Also take a Backup and Restore it into a new Cluster, then verify
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS STS

concurrency:
  group: aws-e2e # never two paid runs at once
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.17.1"
  API_URL: http://127.0.0.1:8000
  STATE_FILE: ${{ github.workspace }}/e2e-clusters.txt

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: aws-e2e
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dbaas-e2e-${{ github.run_id }}
          role-duration-seconds: 10800

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install control-plane and cql-client
        run: |
          (cd control-plane && uv venv && uv pip install -e '.[aws]')
          (cd cql-client && uv venv && uv pip install -e .)

      - name: Start the Control Plane (aws driver)
        working-directory: control-plane
        run: |
          # ADR-0004: Security Groups only admit the operator's IP, here the runner's.
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "runner public IP: ${runner_ip}"
          api_key="e2e-$(openssl rand -hex 16)"
          echo "::add-mask::${api_key}"
          echo "DBAAS_API_KEY=${api_key}" >> "$GITHUB_ENV"
          DBAAS_PROVIDER=aws \
          DBAAS_AWS_REGION="${AWS_REGION}" \
          DBAAS_OPERATOR_CIDR="${runner_ip}/32" \
          DBAAS_TERRAFORM_STATE_BUCKET="${{ vars.DBAAS_TF_STATE_BUCKET }}" \
          DBAAS_BACKUP_BUCKET="${{ vars.DBAAS_BACKUP_BUCKET }}" \
          DBAAS_API_KEYS="${api_key}:github-e2e" \
          DBAAS_DATABASE_URL="sqlite+aiosqlite:///${RUNNER_TEMP}/dbaas.db" \
            nohup .venv/bin/uvicorn dbaas.main:app --host 127.0.0.1 --port 8000 \
            > "${RUNNER_TEMP}/control-plane.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "${API_URL}/api/v1/healthz" && exit 0
            sleep 2
          done
          cat "${RUNNER_TEMP}/control-plane.log"
          exit 1

      - name: Run end-to-end scenario
        working-directory: cql-client
        env:
          DBAAS_API_URL: ${{ env.API_URL }}
          ROWS: ${{ inputs.rows }}
          WITH_RESTORE: ${{ inputs.with_restore }}
        run: |
          extra=()
          if [ "${WITH_RESTORE}" = "true" ]; then extra+=(--with-restore); fi
          .venv/bin/dbaas-e2e \
            --name "e2e-${GITHUB_RUN_ID}" \
            --rows "${ROWS}" \
            --timeout 3600 \
            --state-file "${STATE_FILE}" \
            "${extra[@]}"

      - name: Control Plane log
        if: always()
        run: cat "${RUNNER_TEMP}/control-plane.log" || true

      - name: Safety net - terminate leftover instances
        # dbaas-e2e deletes its Clusters itself (also on failure). This only matters if the
        # runner or the Control Plane died: terminate anything still tagged with one of the
        # Cluster ids it created, and fail the run so a human checks for other leftovers
        # (Security Groups, the Secrets Manager secret).
        if: always()
        run: |
          [ -s "${STATE_FILE}" ] || { echo "no Clusters were created"; exit 0; }
          leftovers=0
          while read -r cluster_id _name; do
            ids="$(aws ec2 describe-instances \
              --filters "Name=tag:dbaas:cluster_id,Values=${cluster_id}" \
                        "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'Reservations[].Instances[].InstanceId' --output text)"
            if [ -n "${ids}" ]; then
              echo "::warning::terminating leftover instances of ${cluster_id}: ${ids}"
              # shellcheck disable=SC2086 # word splitting of the id list is intended
              aws ec2 terminate-instances --instance-ids ${ids} > /dev/null
              leftovers=1
            fi
          done < "${STATE_FILE}"
          exit "${leftovers}"
